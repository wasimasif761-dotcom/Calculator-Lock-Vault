name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Android Environment
        run: |
          echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Lock-v1.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Calculator Lock v1.0.0 (by Waseem Asif)"
          body: |
            ## Calculator Lock & Stealth Vault - v1.0.0 Pro
            
            **Developer:** Waseem Asif
            - **WhatsApp:** +966597447275
            - **Email:** wasimasif761@gmail.com
            
            ### Highlights:
            - Fully functional fake calculator with secret PIN + `=` trigger
            - Hidden Media Vault (Photos, Videos, Files)
            - Hide Apps & Stealth container
            - Smart App Lock with interactive PIN simulation
            - Private Web Browser with instant history burn
            - Video Downloader manager
            - Private Notes with color tags and categories
            - 3-Line Navigation Drawer menu
            - Google Account & Cloud Backup
            - In-App Feedback & Direct WhatsApp/Email support
            
            Directly download the `app-debug.apk` below to test on your Android device!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
